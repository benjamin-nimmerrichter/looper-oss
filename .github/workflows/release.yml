name: release

# A tag is the release. Pushing one builds the artefacts and attaches them to a
# GitHub Release, so "it is in releases" never depends on someone remembering to
# upload four files by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 squashfs-tools zsync binutils
          python -m pip install -r requirements.txt

      - name: source archives + checksums
        run: ./scripts/release.py

      - name: AppImage
        run: ./packaging/linux/build-appimage.sh

      - name: checksums cover the AppImage too
        run: |
          cd dist
          sha256sum looper-oss-*-x86_64.AppImage \
            > "looper-oss-$(cat ../VERSION)-x86_64.AppImage.sha256"
          sha256sum looper-oss-*.tar.gz looper-oss-*.zip \
            looper-oss-*-x86_64.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # through env, never interpolated into the shell: a tag or an input is
          # an attacker-controlled string, and `run:` would execute it.
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "refusing to publish '$tag': not a v* tag" >&2; exit 1 ;;
          esac
          ver="${tag#v}"

          # index(), not a regex: "^## \[0.1.0\]" is the character class
          # [0.1.0] to awk and matches nothing at all -- which is how the first
          # release ended up with an empty body.
          if grep -q "^## \[$ver\]" CHANGELOG.md; then
            awk -v ver="$ver" '
              !found && index($0, "## [" ver "]") == 1 {found=1; next}
              found && index($0, "## [") == 1 {exit}
              found {print}
            ' CHANGELOG.md > /tmp/notes.md
            notes=(--notes-file /tmp/notes.md)
          else
            notes=(--generate-notes)
          fi

          files=(dist/looper-oss-*.tar.gz dist/looper-oss-*.zip
                 dist/looper-oss-*-x86_64.AppImage dist/SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            # re-running (or dispatching on an existing tag) updates in place
            gh release edit "$tag" --title "Looper OSS $ver" "${notes[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "Looper OSS $ver" "${notes[@]}"
          fi
